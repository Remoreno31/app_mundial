        let pts = 0;
        matches.forEach(m => {
            if(m.home === teamName || m.away === teamName) {
                const s1 = parseInt(m.score1);
                const s2 = parseInt(m.score2);
                if(!isNaN(s1) && !isNaN(s2)) { // Solo cuenta si hay marcadores
                    if(m.home === teamName) {
                        if(s1 > s2) pts += 3;
                        else if(s1 === s2) pts += 1;
                    } else {
                        if(s2 > s1) pts += 3;
                        else if(s1 === s2) pts += 1;
                    }
                }
            }
        });
        return pts;
    }
