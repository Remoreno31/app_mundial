 <body data-template-id="__page-root" class="min-h-screen text-white" style="background: rgb(10, 10, 10);">

   </section><!-- ELIMINATORIAS -->

  <script>
    function showTab(tab) {
        ['grupos','partidos','eliminatorias'].forEach(t => {
            document.getElementById('sec-'+t).classList.toggle('hidden', t !== tab);
            const btn = document.getElementById('tab-'+t);
            btn.classList.toggle('tab-active', t === tab);
            btn.classList.toggle('bg-white/10', t !== tab);
        });
    }

    const groups = {
        A: ['Mexico','Corea Del Sur','Chequia','Sudafrica'],
        B: ['Canada','Suiza','Bosnia y Herzegovina','Catar'],
        C: ['Escocia','Marruecos','Brasil','Haiti'],
        D: ['Estados Unidos','Australia','Turquía','Paraguay'],
        E: ['Alemania','Costa De Marfil','Ecuador','Curazao'],
        F: ['Suecia','Japon','Paises Bajos','Tunez'],
        G: ['Nueva Zelanda','Iran','Belgica','Egipto'],
        H: ['Uruguay','Arabia Saudita','España','Cabo Verde'],
        I: ['Noruega','Francia','Senegal','Irak'],
        J: ['Argentina','Austria','Jordania','Argelia'],
        K: ['Colombia','RD Congo','Portugal','Uzbekistan'],
        L: ['Inglaterra','Ghana','Panama','Croacia']
    };

    // 1. Ubicamos los partidos antes de los grupos para poder calcular los puntos
    const matches = [
        {date:'11 Jun',group:'A',home:'Mexico',away:'Sudafrica', score1: '2', score2:'0'},
        {date:'11 Jun',group:'A',home:'Corea Del Sur',away:'Chequia', score1: '2', score2:'1'},
        {date:'12 Jun',group:'B',home:'Canada',away:'Bosnia y Herzegovina', score1: '1', score2:'1'},
        {date:'12 Jun',group:'D',home:'Estados Unidos',away:'Paraguay', score1: '4', score2:'1'},
        {date:'13 Jun',group:'B',home:'Catar',away:'Suiza', score1: '1', score2:'1'},
        {date:'13 Jun',group:'C',home:'Brasil',away:'Marruecos', score1: '1', score2:'1'},
        {date:'13 Jun',group:'C',home:'Haiti',away:'Escocia', score1: '0', score2:'1'},
        {date:'14 Jun',group:'D',home:'Australia',away:'Turquía', score1: '2', score2:'0'},
        {date:'14 Jun',group:'E',home:'Alemania',away:'Marruecos', score1: '7', score2:'1'},
        {date:'14 Jun',group:'F',home:'Paises Bajos',away:'Japon', score1: '2', score2:'2'},
        {date:'14 Jun',group:'E',home:'Costa De Marfil',away:'Ecuador', score1: '1', score2:'0'},
        {date:'14 Jun',group:'F',home:'Suecia',away:'Tunez', score1: '5', score2:'1'},
        {date:'15 Jun',group:'H',home:'España',away:'Cabo Verde', score1: '0', score2:'0'},
        {date:'15 Jun',group:'G',home:'Belgica',away:'Egipto', score1: '1', score2:'1'},
        {date:'15 Jun',group:'H',home:'Arabia Saudita',away:'Uruguay', score1: '1', score2:'1'},
        {date:'15 Jun',group:'G',home:'Suecia',away:'Tunez', score1: '5', score2:'1'},
    ];

    // 2. Función automática para calcular puntos (3 por ganar, 1 por empatar)
    function getPoints(teamName) {
        let pts = 0;
        matches.forEach(m => {
            if(m.home === teamName || m.away === teamName) {
                const s1 = parseInt(m.score1);
                const s2 = parseInt(m.score2);
                if(!isNaN(s1) && !isNaN(s2)) { // Solo cuenta si hay marcadores
                    if(m.home === teamName) {
                        if(s1 > s2) pts += 3;
                        else if(s1 === s2) pts += 1;
                    } else {
                        if(s2 > s1) pts += 3;
                        else if(s1 === s2) pts += 1;
                    }
                }
            }
        });
        return pts;
    }

    // 3. Renderizado de la tabla de Grupos con los puntos alineados a la derecha
    const grid = document.getElementById('groups-grid');
    Object.entries(groups).forEach(([letter, teams]) => {
        const card = document.createElement('div');
        card.className = 'group-card rounded-xl p-3';

        let teamsHtml = teams.map((t,i) => `
            <div class="flex items-center justify-between py-1 text-sm border-b border-white/5 last:border-0">
                <div class="flex items-center gap-2">
                    <span class="w-5 text-center opacity-50">${i+1}</span>
                    <span>${t}</span>
                </div>
                <span class="font-bold text-xs" style="color:#d4a017">${getPoints(t)} pts</span>
            </div>
        `).join('');

        card.innerHTML = `<h3 class="font-bold text-center mb-2" style="color:#d4a017">Grupo ${letter}</h3>` + teamsHtml;
        grid.appendChild(card);
    });

    // 4. Renderizado de Partidos
    const matchesList = document.getElementById('matches-list');
    let lastDate = '';
    matches.forEach(m => {
        if (m.date !== lastDate) {
            lastDate = m.date;
            const h = document.createElement('h3');
            h.className = 'font-bold mt-4 mb-1 text-sm opacity-60 uppercase tracking-wider';
            h.textContent = m.date + ' 2026';
            matchesList.appendChild(h);
        }
        const row = document.createElement('div');
        row.className = 'match-row flex items-center justify-between p-3 rounded-lg group-card text-sm';
        row.innerHTML = `<span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">Gr.${m.group}</span>
            <span class="flex-1 text-right pr-2">${m.home}</span>
            <span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">${m.score1}</span>
            <span class="font-bold px-2">vs</span>
            <span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">${m.score2}</span>
            <span class="flex-1 pl-2">${m.away}</span>`;
        matchesList.appendChild(row);
    });

    // 5. Renderizado de Llaves Eliminatorias
    const bracketData = [
        {
            round: 'Dieciseisavos De Final',
            matches: [
                // Ejemplo de un partido que ya se jugó
                { home: '1A', away: '2B', score1: '2', score2: '1' },
                // Ejemplos de partidos por jugarse (tienen un guion "-")
                { home: '1B', away: '2A', score1: '-', score2: '-' },
                { home: '1C', away: '2D', score1: '-', score2: '-' },
                { home: '1D', away: '2C', score1: '-', score2: '-' },
                { home: '1E', away: '2F', score1: '-', score2: '-' },
                { home: '1F', away: '2E', score1: '-', score2: '-' },
                { home: '1G', away: '2H', score1: '-', score2: '-' },
                { home: '1H', away: '2G', score1: '-', score2: '-' },
                // ... puedes agregar el resto de los 16avos aquí siguiendo el mismo formato
            ]
        },
        {
            round: 'Octavos de Final',
            matches: [
                { home: 'Ganador Llave 1', away: 'Ganador Llave 2', score1: '-', score2: '-' },
                { home: 'Ganador Llave 3', away: 'Ganador Llave 4', score1: '-', score2: '-' },
                // ...
            ]
        },
        {
            round: 'Cuartos de Final',
            matches: [
                { home: 'G.Oct 1', away: 'G.Oct 2', score1: '-', score2: '-' },
                { home: 'G.Oct 3', away: 'G.Oct 4', score1: '-', score2: '-' }
            ]
        },
        {
            round: 'Semifinales',
            matches: [
                { home: 'G.Cuartos 1', away: 'G.Cuartos 2', score1: '-', score2: '-' },
                { home: 'G.Cuartos 3', away: 'G.Cuartos 4', score1: '-', score2: '-' }
            ]
        },
        {
            round: 'Final',
            matches: [
                { home: 'G.Semi 1', away: 'G.Semi 2', score1: '-', score2: '-' }
            ]
        }
    ];

    const bracket = document.getElementById('bracket');
    const bHtml = bracketData.map(r => `
        <div class="mb-8">
            <h3 class="font-bold text-center mb-4 text-lg uppercase tracking-wider" style="color:#d4a017">${r.round}</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${r.matches.map(m => `
                    <div class="match-row flex items-center justify-between p-3 rounded-lg group-card text-sm">
                        <span class="flex-1 text-right pr-2">${m.home}</span>
                        <span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">${m.score1}</span>
                        <span class="font-bold px-2 text-white/50">vs</span>
                        <span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">${m.score2}</span>
                        <span class="flex-1 pl-2">${m.away}</span>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
    bracket.innerHTML = bHtml;
