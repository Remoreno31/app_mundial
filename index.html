<!doctype html>
<html lang="es"><head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Mundial 2026 - Talleres Remaca</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .tab-active { background: #d4a017; color: #000; }
        .group-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .match-row:hover { background: rgba(212,160,23,0.1); }
        .bracket-line { border-color: #d4a017; }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="min-h-screen text-white" style="background: rgb(10, 10, 10);">
  <header class="flex items-center justify-center gap-4 p-4 border-b border-white/10"><img data-template-id="remaca-logo" class="canva-image h-14 object-contain" loading="lazy" src="logo.png" alt="Logo Talleres Remaca" />
   <div>
    <h1 data-template-id="main-title" class="canva-text font-black text-xl md:text-2xl uppercase tracking-wide" style="color: rgb(212, 160, 23); font-weight: 900; font-style: normal; font-size: 28px;">Mundial 2026</h1>
    <p data-template-id="subtitle" class="canva-text text-sm opacity-70" style="color: rgb(255, 255, 255); font-weight: 400; font-style: normal; font-size: 14px;">USA • México • Canadá</p>
   </div>
  </header>
  <nav class="flex justify-center gap-2 p-4 flex-wrap"><button onclick="showTab('grupos')" id="tab-grupos" class="tab-active px-4 py-2 rounded-full text-sm font-bold transition-all">Grupos</button> <button onclick="showTab('partidos')" id="tab-partidos" class="px-4 py-2 rounded-full text-sm font-bold bg-white/10 transition-all">Fase de Grupos</button> <button onclick="showTab('eliminatorias')" id="tab-eliminatorias" class="px-4 py-2 rounded-full text-sm font-bold bg-white/10 transition-all">Eliminatorias</button>
  </nav>
  <main class="max-w-7xl mx-auto p-4"><!-- GRUPOS -->
   <section id="sec-grupos">
    <h2 data-template-id="grupos-title" class="canva-text font-bold text-lg mb-4 text-center" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 21px;">Fase de Grupos — 12 Grupos</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="groups-grid"></div>
   </section><!-- PARTIDOS -->
   <section id="sec-partidos" class="hidden">
    <h2 data-template-id="partidos-title" class="canva-text font-bold text-lg mb-4 text-center" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 21px;">Partidos — Fase de Grupos</h2>
    <div id="matches-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-2"></div>
   </section><!-- ELIMINATORIAS -->
   <section id="sec-eliminatorias" class="hidden">
    <h2 data-template-id="eliminatorias-title" class="canva-text font-bold text-lg mb-4 text-center" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 21px;">Llaves — Fase Eliminatoria</h2>
    <div id="bracket" class="overflow-x-auto"></div>
   </section>
  </main>
  <footer class="text-center p-4 opacity-50 text-xs">
   <p data-template-id="footer-text" class="canva-text" style="color: rgb(255, 255, 255); font-weight: 400; font-style: normal; font-size: 14px;">Talleres Remaca — Mundial FIFA 2026</p>
  </footer>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    function showTab(tab) {
        ['grupos','partidos','eliminatorias'].forEach(t => {
            document.getElementById('sec-'+t).classList.toggle('hidden', t !== tab);
            const btn = document.getElementById('tab-'+t);
            btn.classList.toggle('tab-active', t === tab);
            btn.classList.toggle('bg-white/10', t !== tab);
        });
    }

    const groups = {
        A: ['Mexico','Corea Del Sur','Chequia','Sudafrica'],
        B: ['Canada','Suiza','Bosnia y Herzegovina','Catar'],
        C: ['Escocia','Marruecos','Brasil','Haiti'],
        D: ['Estados Unidos','Australia','Turquía','Paraguay'],
        E: ['Alemania','Costa De Marfil','Ecuador','Curazao'],
        F: ['Suecia','Japon','Paises Bajos','Tunez'],
        G: ['Nueva Zelanda','Iran','Belgica','Egipto'],
        H: ['Uruguay','Arabia Saudita','España','Cabo Verde'],
        I: ['Noruega','Francia','Senegal','Irak'],
        J: ['Argentina','Austria','Jordania','Argelia'],
        K: ['Colombia','RD Congo','Portugal','Uzbekistan'],
        L: ['Inglaterra','Ghana','Panama','Croacia']
    };

    const grid = document.getElementById('groups-grid');
    Object.entries(groups).forEach(([letter, teams]) => {
        const card = document.createElement('div');
        card.className = 'group-card rounded-xl p-3';
        card.innerHTML = `<h3 class="font-bold text-center mb-2" style="color:#d4a017">Grupo ${letter}</h3>` +
            teams.map((t,i) => `<div class="flex items-center gap-2 py-1 text-sm border-b border-white/5 last:border-0"><span class="w-5 text-center opacity-50">${i+1}</span><span>${t}</span></div>`).join('');
        grid.appendChild(card);
    });

    // Sample matches
    const matches = [
        {date:'11 Jun',group:'A',home:'Mexico',away:'Sudafrica', score1: '2', score2:'0'},
        {date:'11 Jun',group:'A',home:'Corea Del Sur',away:'Chequia', score1: '2', score2:'1'},
        {date:'12 Jun',group:'B',home:'Canada',away:'Boznia y Herzegovina', score1: '1', score2:'1'},
        {date:'12 Jun',group:'D',home:'Estados Unidos',away:'Paraguay', score1: '4', score2:'1'},
        {date:'13 Jun',group:'B',home:'Catar',away:'Suiza', score1: '1', score2:'1'},
        {date:'13 Jun',group:'C',home:'Brasil',away:'Marruecos', score1: '1', score2:'1'},
        {date:'13 Jun',group:'C',home:'Haiti',away:'Escocia', score1: '0', score2:'1'},
        {date:'14 Jun',group:'D',home:'Australia',away:'Turquía', score1: '2', score2:'0'},
        {date:'14 Jun',group:'E',home:'Alemania',away:'Marruecos', score1: '7', score2:'1'},
        {date:'14 Jun',group:'F',home:'Paises Bajos',away:'Japon', score1: '2', score2:'2'},
        {date:'14 Jun',group:'E',home:'Costa De Marfil',away:'Ecuador', score1: '1', score2:'0'},
        {date:'14 Jun',group:'F',home:'Suecia',away:'Tunez', score1: '5', score2:'1'},
    ];

    const matchesList = document.getElementById('matches-list');
    let lastDate = '';
    matches.forEach(m => {
        if (m.date !== lastDate) {
            lastDate = m.date;
            const h = document.createElement('h3');
            h.className = 'font-bold mt-4 mb-1 text-sm opacity-60 uppercase tracking-wider';
            h.textContent = m.date + ' 2026';
            matchesList.appendChild(h);
        }
        const row = document.createElement('div');
        row.className = 'match-row flex items-center justify-between p-3 rounded-lg group-card text-sm';
        row.innerHTML = `<span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">Gr.${m.group}</span>
            <span class="flex-1 text-right pr-2">${m.home}</span>
            <span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">${m.score1}</span>
            <span class="font-bold px-2">vs</span>
            <span class="px-2 py-0.5 rounded text-xs font-bold" style="background:#d4a017;color:#000">${m.score2}</span>
            <span class="flex-1 pl-2">${m.away}</span>`;
        matchesList.appendChild(row);
    });

    // Bracket
    const bracketData = [
        {round:'Diesiceisavos De Final',matches:['1A vs 2B','1B vs 2A','1C vs 2D','1D vs 2C','1E vs 2F','1F vs 2E','1G vs 2H','1H vs 2G','1I vs 2J','1J vs 2I','1K vs 2L','1L vs 2K','3°A/B/C vs 3°D/E/F','3°G/H/I vs 3°J/K/L','3°A/B vs 3°C/D','3°E/F vs 3°K/L']},
        {round:'Octavos de Final',matches:['1A vs 2B','1B vs 2A','1C vs 2D','1D vs 2C','1E vs 2F','1F vs 2E','1G vs 2H','1H vs 2G','1I vs 2J','1J vs 2I','1K vs 2L','1L vs 2K','3°A/B/C vs 3°D/E/F','3°G/H/I vs 3°J/K/L','3°A/B vs 3°C/D','3°E/F vs 3°K/L']},
        {round:'Cuartos de Final',matches:['G.Oct 1 vs G.Oct 2','G.Oct 3 vs G.Oct 4','G.Oct 5 vs G.Oct 6','G.Oct 7 vs G.Oct 8','G.Oct 9 vs G.Oct 10','G.Oct 11 vs G.Oct 12','G.Oct 13 vs G.Oct 14','G.Oct 15 vs G.Oct 16']},
        {round:'Semifinales',matches:['G.Cuartos 1 vs G.Cuartos 2','G.Cuartos 3 vs G.Cuartos 4','G.Cuartos 5 vs G.Cuartos 6','G.Cuartos 7 vs G.Cuartos 8']},
        {round:'Final',matches:['G.Semi 1 vs G.Semi 2']}
    ];

    const bracket = document.getElementById('bracket');
    const bHtml = bracketData.map(r => `
        <div class="mb-6">
            <h3 class="font-bold text-center mb-3" style="color:#d4a017">${r.round}</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${r.matches.map(m => `<div class="group-card rounded-lg p-2 text-sm text-center">${m}</div>`).join('')}
            </div>
        </div>
    `).join('');
    bracket.innerHTML = bHtml;
    </script>
